<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/design.css">
    <link rel="stylesheet" href="../css/container.css">
    <link rel="stylesheet" href="../css/inputs.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/texts.css">
    <link rel="stylesheet" href="../animate/animate.css">
</head>

<body class="wholebody">
    <main class="login-container">
        <section class="login-card">
            <div class="login-icon" aria-hidden="true">•</div>
            <h1 class="logtext">Login</h1>
            <form action="../html/button.html" method="get">
                <div class="inbox">
                    <div class="input-group">
                        <label for="email">Email or Username</label>
                        <input type="text" id="email" name="email" placeholder="Enter your email or username" autocomplete="username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="login-btn" id="loginBtn">Login</button>
                </div>
                
                <p class="signup-text">
                    Don't have an account? <a href="../html/index.html" class="signup-link">Sign up</a>
                </p>
            </form>
        </section>
    </main>


</body>

</html>
